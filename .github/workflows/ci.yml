name: CI

'on':
  pull_request:

  push:
    branches-ignore:
      - main

  workflow_call:
    inputs:
      ref:
        description: Git reference to test
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  docker-smoke:
    name: Build the image and smoke-test it
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          tags: floria-selfdock:ci
          cache-from: type=gha,scope=selfdock
          cache-to: type=gha,scope=selfdock,mode=max

      - name: Start it in demo mode and check it responds
        run: |
          docker run -d \
            --name selfdock \
            -p 3000:3000 \
            -e FLORIA_DEMO=1 \
            floria