# Deploy: publish the Docker image to GitHub Container Registry and, for version tags, create a GitHub Release.
#
#   push to main      -> ghcr.io/floriaapps/floria-selfdock:edge  (and :sha-<commit>)
#   push of tag v1.2.3 -> :1.2.3  :1.2  :1  :latest  + a GitHub Release with ready-to-run compose files
#
# To release a version:  git tag v0.1.0 && git push origin v0.1.0
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # The registry requires a lowercase image name.
  IMAGE: ghcr.io/floriaapps/floria-selfdock

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish image (amd64 + arm64)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # QEMU lets the amd64 runner produce the arm64 image (Raspberry Pi and other ARM servers).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          labels: |
            org.opencontainers.image.title=Floria SelfDock
            org.opencontainers.image.description=A friendly self-hosted Docker dashboard, in Material 3 Expressive style
            org.opencontainers.image.vendor=FloriaApps

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=selfdock
          cache-to: type=gha,scope=selfdock,mode=max
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The compose files in the repository build the image from source. For a release we swap that for the
      # published image, so people can run them without building anything.
      - name: Prepare the release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir release
          for f in docker-compose.yml docker-compose.simple.yml; do
            sed -e '/# image: ghcr.io/d' \
                -e "s#^    build: \.#    image: ${IMAGE}:${VERSION}#" \
                "$f" > "release/$f"
            grep -q "image: ${IMAGE}:${VERSION}" "release/$f" || { echo "image line missing in $f"; exit 1; }
          done
          # GitHub drops the leading dot from asset names, so we publish it as env.example.
          cp .env.example release/env.example
          # Optional add-ons: they only add settings, so they need no image line.
          cp docker-compose.stacks.yml docker-compose.stacks-apply.yml release/

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" release/* \
            --verify-tag \
            --generate-notes \
            --title "Floria SelfDock $TAG" \
            "${flags[@]}"
