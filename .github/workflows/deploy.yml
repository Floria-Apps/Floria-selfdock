name: Deploy

'on':
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_version:
        description: 'Existing version tag without v (e.g. 0.2.0). Leave empty for a normal build.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.release_version }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/floria-apps/floria-selfdock

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.release_version != '' && format('refs/tags/v{0}', inputs.release_version) || github.ref }}

  publish:
    name: Publish image (amd64 + arm64)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_version != '' && format('refs/tags/v{0}', inputs.release_version) || github.ref }}
          fetch-depth: 0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=edge,branch=main,enable=${{ inputs.release_version == '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(inputs.release_version, '0.') && !startsWith(github.ref_name, 'v0.') }}
            type=sha
          labels: |
            org.opencontainers.image.title=Floria SelfDock
            org.opencontainers.image.description=A friendly self-hosted Docker dashboard in Material 3 Expressive style
            org.opencontainers.image.vendor=FloriaApps

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=selfdock
          cache-to: type=gha,scope=selfdock,mode=max
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Published Docker image"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    needs: publish
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_version != '' && format('refs/tags/v{0}', inputs.release_version) || github.ref }}
          fetch-depth: 0

      - name: Prepare the release files
        env:
          TAG: ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir release

          for f in docker-compose.yml docker-compose.simple.yml; do
            sed \
              -e '/# image: ghcr.io/d' \
              -e "s#^    build: \.#    image: ${IMAGE}:${VERSION}#" \
              "$f" > "release/$f"

            grep -q "image: ${IMAGE}:${VERSION}" "release/$f" || {
              echo "Image line missing in $f"
              exit 1
            }
          done

          cp .env.example release/env.example
          cp docker-compose.stacks.yml release/docker-compose.stacks-apply.yml

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          TAG: ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || github.ref_name }}
        run: |
          flags=()

          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating its assets."
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --verify-tag \
              --generate-notes \
              --title "Floria SelfDock Release $TAG" \
              "${flags[@]}"
          fi