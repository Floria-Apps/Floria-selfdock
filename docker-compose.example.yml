# Floria SelfDock - Example Docker Compose configuration with a Docker API proxy.
# This file defines the SelfDock application and a restricted proxy for Docker API access.

# Compose project name. Compose uses this name to group containers, networks, and volumes.
name: floria-selfdock

services:
  selfdock:
    # Build the application image from the Dockerfile in the current directory.
    build: .
    # Fixed container name, instead of a name generated by Docker Compose.
    container_name: floria-selfdock
    # Restart the container automatically unless it was explicitly stopped.
    restart: unless-stopped
    ports:
      # Publish the app's container port 3000 on the host port set by SELFDOCK_PORT.
      # If SELFDOCK_PORT is not set, use host port 3000.
      - "${SELFDOCK_PORT:-3000}:3000"
    environment:
      # Send Docker API requests through the restricted proxy, not directly to the Docker socket.
      DOCKER_HOST: tcp://docker-proxy:2375
      # Set the container's time zone. Defaults to UTC when TZ is not set.
      TZ: ${TZ:-UTC}
      # Directory inside the container where SelfDock expects to find stack definitions.
      # Replace this placeholder with the actual path used by your setup.
      FLORIA_STACKS_DIR: /path/to/your/stacks
    volumes:
      # Persist SelfDock application data in a named Docker volume.
      - selfdock-data:/data
      # Mount the host's stack directory into the container so SelfDock can access stack files.
      # Replace both placeholder paths with the correct host and container paths.
      - /path/to/your/stacks:/path/to/your/stacks
    labels:
      # Custom label that tells compatible stack dashboards to hide this container.
      floria.hide: "true"
    depends_on:
      # Start the Docker API proxy service before starting SelfDock.
      - docker-proxy
    networks:
      # Attach SelfDock to the default Compose network.
      - default
      # Also attach SelfDock to the isolated network used to reach the Docker API proxy.
      - docker-api

  docker-proxy:
    # Image for a proxy that exposes selected Docker API endpoints.
    image: tecnativa/docker-socket-proxy:0.3.0
    # Fixed container name for the Docker API proxy.
    container_name: floria-selfdock-docker-proxy
    # Restart automatically unless explicitly stopped.
    restart: unless-stopped
    environment:
      # Allow the proxy to list and inspect containers.
      CONTAINERS: 1
      # Allow the proxy to receive Docker events.
      EVENTS: 1
      # Allow API requests that change Docker state, such as creating or updating resources.
      # Keep this enabled only if SelfDock needs to perform such actions.
      POST: 1
      # Allow starting containers.
      ALLOW_START: 1
      # Allow stopping containers.
      ALLOW_STOP: 1
      # Allow restarting containers.
      ALLOW_RESTARTS: 1
    volumes:
      # Give the proxy access to the host Docker socket, mounted read-only.
      # The proxy enforces API permissions; a read-only socket mount alone does not restrict API actions.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # Connect the proxy only to the isolated Docker API network.
      - docker-api

networks:
  docker-api:
    # Prevent containers on this network from reaching external networks through it.
    # This network isolation does not by itself replace Docker API permission controls.
    internal: true

volumes:
  # Named volume used to keep SelfDock data when the container is recreated.
  selfdock-data:

